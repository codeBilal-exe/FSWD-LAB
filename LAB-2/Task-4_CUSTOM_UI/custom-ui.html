<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom UI</title>
    <link rel="stylesheet" href="custom-ui.css" />
  </head>
  <body>
    <div class="ui-page">
      <div class="shape shape-one"></div>
      <div class="shape shape-two"></div>

      <aside class="sidebar">
        <div class="brand">NOVA</div>
        <nav>
          <a class="active">Dashboard</a>
          <a>Analytics</a>
          <a>Team</a>
          <a>Reports</a>
          <a>Settings</a>
        </nav>
      </aside>

      <main class="dashboard">
        <header class="dashboard-header">
          <div>
            <p class="eyebrow">Overview</p>
            <h1>Performance Dashboard</h1>
          </div>
          <button>Export</button>
        </header>

        <section class="cards">
          <div class="card accent">
            <p>Total Revenue</p>
            <h2>$84.2K</h2>
            <span>+12.8% this month</span>
          </div>
          <div class="card">
            <p>Active Users</p>
            <h2>24.6K</h2>
            <span>+5.4% this week</span>
          </div>
          <div class="card">
            <p>Conversion</p>
            <h2>7.8%</h2>
            <span>+1.2% increase</span>
          </div>
        </section>

        <section class="main-grid">
          <div class="panel chart-panel">
            <h3>Traffic</h3>
            <div class="bars">
              <span style="height: 40%"></span>
              <span style="height: 55%"></span>
              <span style="height: 68%"></span>
              <span style="height: 50%"></span>
              <span style="height: 80%"></span>
              <span style="height: 90%"></span>
              <span style="height: 75%"></span>
              <span style="height: 100%"></span>
            </div>
          </div>

          <div class="panel task-panel">
            <h3>Tasks</h3>
            <ul>
              <li><span class="check"></span> Design sprint review</li>
              <li><span class="check"></span> User onboarding flow</li>
              <li><span class="check"></span> Marketing campaign</li>
            </ul>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
