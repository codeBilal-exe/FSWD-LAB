<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="FSWD Lab Portal" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>FSWD Lab Portal</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8902a"/><stop offset=".5" stop-color="#f3dc8a"/><stop offset="1" stop-color="#b8902a"/>
      <animate attributeName="x1" values="-1;0;-1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1;0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d4af37" stop-opacity=".28"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d4af37" fill-opacity=".16"/></pattern>
    <clipPath id="strip"><rect x="0" y="292" width="1200" height="48"/></clipPath>
  </defs>
  <style>
    .spin1{transform-origin:960px 156px;animation:spin 30s linear infinite}
    .spin2{transform-origin:960px 156px;animation:spin 46s linear infinite reverse}
    .hand-s{transform-origin:960px 156px;animation:spin 60s linear infinite}
    .hand-m{transform-origin:960px 156px;transform:rotate(60deg);animation:spinm 3600s linear infinite}
    .hand-h{transform-origin:960px 156px;transform:rotate(305deg);animation:spinh 43200s linear infinite}
    .float{animation:bob 6s ease-in-out infinite}
    .pulse{animation:pulse 2s ease-out infinite;transform-origin:960px 156px}
    .mq{animation:mq 36s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes spinm{from{transform:rotate(60deg)}to{transform:rotate(420deg)}}
    @keyframes spinh{from{transform:rotate(305deg)}to{transform:rotate(665deg)}}
    @keyframes bob{50%{transform:translateY(-8px)}}
    @keyframes pulse{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(2.2)}}
    @keyframes mq{to{transform:translateX(-1200px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <rect width="1200" height="340" fill="#090a0d"/>
  <rect width="1200" height="340" fill="url(#dots)"/>
  <circle cx="960" cy="156" r="230" fill="url(#glow)"/>

  <!-- title block -->
  <g font-family="Georgia,'Times New Roman',serif">
    <text x="70" y="86" font-family="'Courier New',monospace" font-size="13" letter-spacing="5" fill="#d4af37">FULL STACK WEB DEVELOPMENT</text>
    <text x="70" y="168" font-size="76" font-weight="700" fill="#eceae5" letter-spacing="-1">FSWD Lab</text>
    <text x="70" y="244" font-size="76" font-weight="400" fill="url(#gold)" letter-spacing="-1">Portal</text>
  </g>
  <text x="70" y="272" font-family="'Courier New',monospace" font-size="14" fill="#8d92a3" letter-spacing="1">every lab, in motion · preview · inspect · run</text>

  <!-- clock -->
  <g class="float">
    <circle cx="960" cy="156" r="112" fill="#11131a" stroke="#d4af37" stroke-opacity=".55"/>
    <circle cx="960" cy="156" r="98" fill="none" stroke="#d4af37" stroke-opacity=".18"/>
    <g stroke="#d4af37" stroke-linecap="round">
      <path d="M960 52v12M960 248v12M1064 156h-12M868 156h-12" stroke-width="3"/>
      <path d="M1012 66l-6 10M1050 104l-10 6M1050 208l-10-6M1012 246l-6-10M908 246l6-10M870 208l10-6M870 104l10 6M908 66l6 10" stroke-width="1.5" stroke-opacity=".7"/>
    </g>
    <g class="spin1"><circle cx="960" cy="30" r="5" fill="#d4af37"/><circle cx="960" cy="30" r="12" fill="none" stroke="#d4af37" stroke-opacity=".35"/></g>
    <g class="spin2"><circle cx="1108" cy="156" r="4" fill="#668dff"/><circle cx="812" cy="156" r="4" fill="#ef6848"/><circle cx="960" cy="304" r="4" fill="#70bc8c"/></g>
    <circle cx="960" cy="156" r="146" fill="none" stroke="#d4af37" stroke-opacity=".22" stroke-dasharray="3 9"/>
    <circle cx="960" cy="156" r="172" fill="none" stroke="#d4af37" stroke-opacity=".12"/>
    <line class="hand-h" x1="960" y1="156" x2="960" y2="106" stroke="#d4af37" stroke-width="6" stroke-linecap="round"/>
    <line class="hand-m" x1="960" y1="156" x2="960" y2="82" stroke="#eceae5" stroke-width="4" stroke-linecap="round"/>
    <line class="hand-s" x1="960" y1="176" x2="960" y2="70" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round"/>
    <circle class="pulse" cx="960" cy="156" r="8" fill="#d4af37"/>
    <circle cx="960" cy="156" r="8" fill="#d4af37"/>
  </g>

  <!-- ticker -->
  <rect x="0" y="292" width="1200" height="1" fill="#d4af37" fill-opacity=".35"/>
  <g clip-path="url(#strip)">
    <g class="mq" font-family="'Courier New',monospace" font-size="15" fill="none" stroke="#8d92a3" stroke-width=".8" letter-spacing="2">
      <text x="0" y="322" textLength="1180" lengthAdjust="spacing">HTML  ◆  CSS  ◆  JAVASCRIPT  ◆  BOOTSTRAP  ◆  ASYNC  ◆  PROMISES  ◆  MODULES  ◆  HTML  ◆  CSS</text>
      <text x="1200" y="322" textLength="1180" lengthAdjust="spacing">HTML  ◆  CSS  ◆  JAVASCRIPT  ◆  BOOTSTRAP  ◆  ASYNC  ◆  PROMISES  ◆  MODULES  ◆  HTML  ◆  CSS</text>
    </g>
  </g>
</svg>
