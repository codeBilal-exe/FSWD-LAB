<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In — Northstar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="store.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar bg-white border-bottom">
        <div class="container-xl d-flex flex-wrap justify-content-between gap-2 py-2"><a
                class="navbar-brand fw-bold fs-3 store-brand" href="index.html">northstar<span
                    class="text-primary">.</span></a>
            <div class="navbar-nav flex-row flex-wrap align-items-center gap-3"><a class="nav-link"
                    href="shop.html">Shop</a><a class="nav-link" href="signup.html">Create account</a><a
                    class="btn btn-dark btn-sm" href="cart.html">Bag · 2</a></div>
        </div>
    </nav>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 col-xl-5">
                <div class="text-center mb-4">
                    <div class="display-5 text-primary">✦</div>
                    <h1 class="h2 fw-semibold">Welcome back</h1>
                    <p class="text-secondary">Log in to find your saved details and orders.</p>
                </div>
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <form action="shop.html" method="get">
                            <div class="mb-3"><label class="form-label" for="email">Email address</label><input
                                    class="form-control form-control-lg" id="email" name="email" type="email"
                                    autocomplete="email" placeholder="you@example.com" required></div>
                            <div class="mb-3">
                                <div class="d-flex justify-content-between"><label class="form-label"
                                        for="password">Password</label><a class="small link-secondary"
                                        href="#reset">Forgot password?</a></div><input
                                    class="form-control form-control-lg" id="password" name="password" type="password"
                                    autocomplete="current-password" placeholder="Your password" required>
                            </div>
                            <div class="form-check mb-4"><input class="form-check-input" type="checkbox"
                                    id="remember"><label class="form-check-label small" for="remember">Keep me logged
                                    in</label></div><button class="btn btn-dark btn-lg w-100" type="submit">Log
                                in</button>
                        </form>
                        <div class="text-center my-3 small text-secondary">New to Northstar?</div><a href="signup.html"
                            class="btn btn-outline-dark w-100">Create an account</a>
                    </div>
                </div>
                <p class="text-center small mt-3"><a class="link-secondary" href="index.html">← Continue as a guest</a>
                </p>
            </div>
        </div>
    </main>
    <footer class="text-center text-secondary small py-4">Your details stay yours · © 2026 Northstar</footer>
</body>

</html>
